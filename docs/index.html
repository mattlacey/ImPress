<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImPress - Image Compression Tool</title>
    <meta name="description" content="Compress and resize images instantly for forums and online use">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ImPress">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ ImPress</h1>
            <p>Compress and resize images instantly for forums and online use</p>
        </header>

        <main>
            <div class="upload-section">
                <label for="file-input" class="file-label">
                    <div class="upload-box">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span class="upload-text">Click to select images or take a photo</span>
                        <span class="upload-hint">Or drag and drop images here</span>
                    </div>
                </label>
                <input type="file" id="file-input" accept="image/*" multiple capture="environment">
            </div>

            <div class="settings">
                <label for="max-dimension" class="setting-label">
                    Maximum dimension (px):
                    <input type="number" id="max-dimension" value="1024" min="100" max="4096">
                </label>
                <label for="quality" class="setting-label">
                    JPEG Quality (%):
                    <input type="number" id="quality" value="90" min="10" max="100">
                </label>
            </div>

            <div id="progress-section" class="progress-section hidden">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <span class="progress-text">Processing...</span>
            </div>

            <div id="results" class="results hidden">
                <h2>Resized Images</h2>
                <div id="image-grid" class="image-grid"></div>
                <button id="download-all" class="btn btn-primary">Download All</button>
            </div>
        </main>

        <footer>
            <button id="install-btn" class="btn btn-install hidden">Install App</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
